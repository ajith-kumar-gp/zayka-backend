services:
  - type: web
    name: zayka-backend
    env: python
    rootDir: zaykabackend/Zayka-Backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_FILE
        value: /opt/render/project/src/src/data/zayka_data.json
